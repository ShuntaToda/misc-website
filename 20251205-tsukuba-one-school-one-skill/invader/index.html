<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPACE INVADERS</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: #0a0a0a;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Press Start 2P", cursive;
        overflow: hidden;
      }

      /* Scanline effect */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.15),
          rgba(0, 0, 0, 0.15) 1px,
          transparent 1px,
          transparent 2px
        );
        z-index: 1000;
      }

      /* CRT flicker */
      body::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.3) 100%);
        z-index: 999;
      }

      .game-container {
        position: relative;
        background: linear-gradient(180deg, #0d0d1a 0%, #1a0a2e 50%, #0d0d1a 100%);
        border: 4px solid #ff00ff;
        border-radius: 8px;
        box-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff33, inset 0 0 60px rgba(255, 0, 255, 0.1);
        padding: 20px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        padding: 10px;
        background: rgba(0, 255, 255, 0.05);
        border: 2px solid #00ffff;
        border-radius: 4px;
      }

      .score-container,
      .lives-container,
      .level-container {
        text-align: center;
      }

      .label {
        font-size: 8px;
        color: #00ffff;
        text-shadow: 0 0 10px #00ffff;
        margin-bottom: 5px;
      }

      .value {
        font-size: 14px;
        color: #ffff00;
        text-shadow: 0 0 15px #ffff00;
      }

      #gameCanvas {
        display: block;
        background: #000010;
        border: 2px solid #333;
        image-rendering: pixelated;
      }

      .controls {
        margin-top: 15px;
        text-align: center;
        font-size: 8px;
        color: #888;
      }

      .controls span {
        margin: 0 10px;
        color: #00ff00;
        text-shadow: 0 0 5px #00ff00;
      }

      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
      }

      .overlay.hidden {
        display: none;
      }

      .title {
        font-size: 24px;
        color: #00ff00;
        text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00, 0 0 40px #00ff00;
        margin-bottom: 30px;
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }

      .start-btn {
        font-family: "Press Start 2P", cursive;
        font-size: 12px;
        padding: 15px 30px;
        background: transparent;
        border: 3px solid #ff00ff;
        color: #ff00ff;
        cursor: pointer;
        text-shadow: 0 0 10px #ff00ff;
        box-shadow: 0 0 20px #ff00ff55;
        transition: all 0.3s ease;
        margin: 10px;
      }

      .start-btn:hover {
        background: #ff00ff22;
        box-shadow: 0 0 30px #ff00ff;
        transform: scale(1.05);
      }

      .game-over-text {
        font-size: 20px;
        color: #ff0000;
        text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
        margin-bottom: 20px;
      }

      .final-score {
        font-size: 12px;
        color: #ffff00;
        text-shadow: 0 0 10px #ffff00;
        margin-bottom: 30px;
      }

      .mobile-controls {
        display: none;
        margin-top: 15px;
        gap: 10px;
      }

      .mobile-btn {
        font-family: "Press Start 2P", cursive;
        font-size: 16px;
        width: 60px;
        height: 60px;
        background: rgba(0, 255, 255, 0.1);
        border: 2px solid #00ffff;
        color: #00ffff;
        cursor: pointer;
        border-radius: 8px;
      }

      .mobile-btn:active {
        background: rgba(0, 255, 255, 0.3);
      }

      .fire-btn {
        width: 100px;
        background: rgba(255, 0, 255, 0.1);
        border-color: #ff00ff;
        color: #ff00ff;
      }

      @media (max-width: 600px) {
        .mobile-controls {
          display: flex;
          justify-content: center;
        }
        .controls {
          display: none;
        }
      }

      /* Stars background */
      .stars {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: -1;
      }

      .star {
        position: absolute;
        background: white;
        border-radius: 50%;
        animation: twinkle 2s ease-in-out infinite;
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.3;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="stars" id="stars"></div>

    <div class="game-container">
      <div class="header">
        <div class="score-container">
          <div class="label">SCORE</div>
          <div class="value" id="score">0</div>
        </div>
        <div class="level-container">
          <div class="label">LEVEL</div>
          <div class="value" id="level">1</div>
        </div>
        <div class="lives-container">
          <div class="label">LIVES</div>
          <div class="value" id="lives">❤❤❤</div>
        </div>
      </div>

      <canvas id="gameCanvas" width="480" height="400"></canvas>

      <div class="controls"><span>← →</span> 移動 <span>SPACE</span> 発射 <span>P</span> ポーズ</div>

      <div class="mobile-controls">
        <button class="mobile-btn" id="leftBtn">◀</button>
        <button class="mobile-btn fire-btn" id="fireBtn">FIRE</button>
        <button class="mobile-btn" id="rightBtn">▶</button>
      </div>

      <div class="overlay" id="startOverlay">
        <div class="title">SPACE INVADERS</div>
        <button class="start-btn" id="startBtn">START GAME</button>
      </div>

      <div class="overlay hidden" id="gameOverOverlay">
        <div class="game-over-text">GAME OVER</div>
        <div class="final-score">SCORE: <span id="finalScore">0</span></div>
        <button class="start-btn" id="restartBtn">PLAY AGAIN</button>
      </div>

      <div class="overlay hidden" id="pauseOverlay">
        <div class="title" style="font-size: 16px">PAUSED</div>
        <button class="start-btn" id="resumeBtn">RESUME</button>
      </div>
    </div>

    <script>
      // Create stars background
      const starsContainer = document.getElementById("stars");
      for (let i = 0; i < 100; i++) {
        const star = document.createElement("div");
        star.className = "star";
        star.style.left = Math.random() * 100 + "%";
        star.style.top = Math.random() * 100 + "%";
        star.style.width = Math.random() * 2 + 1 + "px";
        star.style.height = star.style.width;
        star.style.animationDelay = Math.random() * 2 + "s";
        starsContainer.appendChild(star);
      }

      // Game
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      // Game state
      let gameRunning = false;
      let gamePaused = false;
      let score = 0;
      let lives = 3;
      let level = 1;

      // Player
      const player = {
        x: canvas.width / 2 - 20,
        y: canvas.height - 50,
        width: 40,
        height: 20,
        speed: 5,
        color: "#00ff00",
      };

      // Bullets
      let playerBullets = [];
      let enemyBullets = [];
      const bulletSpeed = 7;

      // Invaders
      let invaders = [];
      let invaderDirection = 1;
      let invaderSpeed = 1;
      let invaderMoveDown = false;

      // Shields
      let shields = [];

      // UFO
      let ufo = null;
      let ufoTimer = 0;

      // Input
      const keys = {};
      let canShoot = true;

      // Explosions
      let explosions = [];

      // Initialize game
      function initGame() {
        score = 0;
        lives = 3;
        level = 1;
        player.x = canvas.width / 2 - 20;
        playerBullets = [];
        enemyBullets = [];
        explosions = [];
        ufo = null;
        ufoTimer = 0;
        createInvaders();
        createShields();
        updateUI();
      }

      function createInvaders() {
        invaders = [];
        invaderSpeed = 1 + (level - 1) * 0.3;
        invaderDirection = 1;

        const rows = 5;
        const cols = 11;
        const invaderWidth = 30;
        const invaderHeight = 20;
        const padding = 10;
        const startX = 30;
        const startY = 50;

        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            let type, points, color;
            if (row === 0) {
              type = "squid";
              points = 30;
              color = "#ff00ff";
            } else if (row < 3) {
              type = "crab";
              points = 20;
              color = "#00ffff";
            } else {
              type = "octopus";
              points = 10;
              color = "#ffff00";
            }

            invaders.push({
              x: startX + col * (invaderWidth + padding),
              y: startY + row * (invaderHeight + padding),
              width: invaderWidth,
              height: invaderHeight,
              type: type,
              points: points,
              color: color,
              frame: 0,
            });
          }
        }
      }

      function createShields() {
        shields = [];
        const shieldWidth = 60;
        const shieldHeight = 40;
        const positions = [60, 160, 260, 360];

        positions.forEach((x) => {
          const shield = {
            x: x,
            y: canvas.height - 100,
            pixels: [],
          };

          // Create shield pixels
          for (let py = 0; py < shieldHeight; py += 4) {
            for (let px = 0; px < shieldWidth; px += 4) {
              // Create arch shape
              const centerX = shieldWidth / 2;
              const isArch = py > 25 && px > 15 && px < 45;
              const isTop = py < 10 && (px < 10 || px > 50);

              if (!isArch && !isTop) {
                shield.pixels.push({
                  x: px,
                  y: py,
                  width: 4,
                  height: 4,
                  alive: true,
                });
              }
            }
          }
          shields.push(shield);
        });
      }

      function updateUI() {
        document.getElementById("score").textContent = score;
        document.getElementById("level").textContent = level;
        document.getElementById("lives").textContent = "❤".repeat(lives);
      }

      // Drawing functions
      function drawPlayer() {
        ctx.fillStyle = player.color;
        ctx.shadowColor = player.color;
        ctx.shadowBlur = 10;

        // Ship body
        ctx.fillRect(player.x, player.y + 10, player.width, 10);
        ctx.fillRect(player.x + 5, player.y + 5, player.width - 10, 5);
        ctx.fillRect(player.x + 15, player.y, 10, 5);

        ctx.shadowBlur = 0;
      }

      function drawInvader(inv) {
        ctx.fillStyle = inv.color;
        ctx.shadowColor = inv.color;
        ctx.shadowBlur = 8;

        const x = inv.x;
        const y = inv.y;
        const w = inv.width;
        const h = inv.height;

        if (inv.type === "squid") {
          // Squid shape
          ctx.fillRect(x + 10, y, 10, 4);
          ctx.fillRect(x + 6, y + 4, 18, 4);
          ctx.fillRect(x + 2, y + 8, 26, 4);
          ctx.fillRect(x + 6, y + 12, 6, 4);
          ctx.fillRect(x + 18, y + 12, 6, 4);
          if (inv.frame === 0) {
            ctx.fillRect(x, y + 16, 6, 4);
            ctx.fillRect(x + 24, y + 16, 6, 4);
          } else {
            ctx.fillRect(x + 8, y + 16, 6, 4);
            ctx.fillRect(x + 16, y + 16, 6, 4);
          }
        } else if (inv.type === "crab") {
          // Crab shape
          ctx.fillRect(x + 4, y, 6, 4);
          ctx.fillRect(x + 20, y, 6, 4);
          ctx.fillRect(x + 8, y + 4, 14, 4);
          ctx.fillRect(x + 4, y + 8, 22, 4);
          ctx.fillRect(x, y + 12, 30, 4);
          if (inv.frame === 0) {
            ctx.fillRect(x, y + 16, 8, 4);
            ctx.fillRect(x + 22, y + 16, 8, 4);
          } else {
            ctx.fillRect(x + 4, y + 16, 8, 4);
            ctx.fillRect(x + 18, y + 16, 8, 4);
          }
        } else {
          // Octopus shape
          ctx.fillRect(x + 8, y, 14, 4);
          ctx.fillRect(x + 4, y + 4, 22, 4);
          ctx.fillRect(x, y + 8, 30, 4);
          ctx.fillRect(x + 4, y + 12, 6, 4);
          ctx.fillRect(x + 12, y + 12, 6, 4);
          ctx.fillRect(x + 20, y + 12, 6, 4);
          if (inv.frame === 0) {
            ctx.fillRect(x + 2, y + 16, 6, 4);
            ctx.fillRect(x + 22, y + 16, 6, 4);
          } else {
            ctx.fillRect(x + 6, y + 16, 6, 4);
            ctx.fillRect(x + 18, y + 16, 6, 4);
          }
        }

        ctx.shadowBlur = 0;
      }

      function drawBullet(bullet, color) {
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
        ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
        ctx.shadowBlur = 0;
      }

      function drawShields() {
        shields.forEach((shield) => {
          ctx.fillStyle = "#00ff00";
          shield.pixels.forEach((pixel) => {
            if (pixel.alive) {
              ctx.fillRect(shield.x + pixel.x, shield.y + pixel.y, pixel.width, pixel.height);
            }
          });
        });
      }

      function drawUFO() {
        if (!ufo) return;

        ctx.fillStyle = "#ff0000";
        ctx.shadowColor = "#ff0000";
        ctx.shadowBlur = 15;

        ctx.fillRect(ufo.x + 15, ufo.y, 20, 6);
        ctx.fillRect(ufo.x + 5, ufo.y + 6, 40, 8);
        ctx.fillRect(ufo.x, ufo.y + 14, 50, 6);
        ctx.fillRect(ufo.x + 5, ufo.y + 20, 8, 4);
        ctx.fillRect(ufo.x + 20, ufo.y + 20, 10, 4);
        ctx.fillRect(ufo.x + 37, ufo.y + 20, 8, 4);

        ctx.shadowBlur = 0;
      }

      function drawExplosions() {
        explosions.forEach((exp, index) => {
          ctx.fillStyle = exp.color;
          ctx.shadowColor = exp.color;
          ctx.shadowBlur = 15;

          exp.particles.forEach((p) => {
            ctx.fillRect(p.x, p.y, 3, 3);
          });

          ctx.shadowBlur = 0;
        });
      }

      // Update functions
      function updatePlayer() {
        if (keys["ArrowLeft"] || keys["a"]) {
          player.x = Math.max(0, player.x - player.speed);
        }
        if (keys["ArrowRight"] || keys["d"]) {
          player.x = Math.min(canvas.width - player.width, player.x + player.speed);
        }
      }

      function updateBullets() {
        // Player bullets
        playerBullets = playerBullets.filter((bullet) => {
          bullet.y -= bulletSpeed;
          return bullet.y > -bullet.height;
        });

        // Enemy bullets
        enemyBullets = enemyBullets.filter((bullet) => {
          bullet.y += bulletSpeed * 0.6;
          return bullet.y < canvas.height;
        });
      }

      let frameCount = 0;
      function updateInvaders() {
        frameCount++;
        if (frameCount % 30 === 0) {
          invaders.forEach((inv) => (inv.frame = (inv.frame + 1) % 2));
        }

        let moveDown = false;
        let leftMost = canvas.width;
        let rightMost = 0;

        invaders.forEach((inv) => {
          leftMost = Math.min(leftMost, inv.x);
          rightMost = Math.max(rightMost, inv.x + inv.width);
        });

        if (rightMost >= canvas.width - 10 && invaderDirection > 0) {
          invaderDirection = -1;
          moveDown = true;
        } else if (leftMost <= 10 && invaderDirection < 0) {
          invaderDirection = 1;
          moveDown = true;
        }

        invaders.forEach((inv) => {
          inv.x += invaderDirection * invaderSpeed;
          if (moveDown) {
            inv.y += 15;
          }

          // Check if invaders reached bottom
          if (inv.y + inv.height >= player.y) {
            gameOver();
          }
        });

        // Enemy shooting
        if (frameCount % 60 === 0 && invaders.length > 0) {
          const shooters = [];
          const cols = {};

          invaders.forEach((inv) => {
            const col = Math.floor(inv.x / 40);
            if (!cols[col] || inv.y > cols[col].y) {
              cols[col] = inv;
            }
          });

          Object.values(cols).forEach((inv) => shooters.push(inv));

          if (shooters.length > 0) {
            const shooter = shooters[Math.floor(Math.random() * shooters.length)];
            enemyBullets.push({
              x: shooter.x + shooter.width / 2 - 2,
              y: shooter.y + shooter.height,
              width: 4,
              height: 12,
            });
          }
        }
      }

      function updateUFO() {
        ufoTimer++;

        if (!ufo && ufoTimer > 600 && Math.random() < 0.01) {
          ufo = {
            x: -50,
            y: 30,
            width: 50,
            height: 24,
            speed: 2,
            points: [50, 100, 150, 300][Math.floor(Math.random() * 4)],
          };
          ufoTimer = 0;
        }

        if (ufo) {
          ufo.x += ufo.speed;
          if (ufo.x > canvas.width) {
            ufo = null;
          }
        }
      }

      function updateExplosions() {
        explosions = explosions.filter((exp) => {
          exp.life--;
          exp.particles.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
          });
          return exp.life > 0;
        });
      }

      function createExplosion(x, y, color) {
        const particles = [];
        for (let i = 0; i < 8; i++) {
          particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
          });
        }
        explosions.push({
          particles: particles,
          color: color,
          life: 20,
        });
      }

      // Collision detection
      function checkCollisions() {
        // Player bullets vs invaders
        playerBullets.forEach((bullet, bi) => {
          invaders.forEach((inv, ii) => {
            if (
              bullet.x < inv.x + inv.width &&
              bullet.x + bullet.width > inv.x &&
              bullet.y < inv.y + inv.height &&
              bullet.y + bullet.height > inv.y
            ) {
              createExplosion(inv.x + inv.width / 2, inv.y + inv.height / 2, inv.color);
              score += inv.points;
              invaders.splice(ii, 1);
              playerBullets.splice(bi, 1);
              updateUI();

              // Speed up remaining invaders
              invaderSpeed += 0.02;
            }
          });

          // Player bullets vs UFO
          if (
            ufo &&
            bullet.x < ufo.x + ufo.width &&
            bullet.x + bullet.width > ufo.x &&
            bullet.y < ufo.y + ufo.height &&
            bullet.y + bullet.height > ufo.y
          ) {
            createExplosion(ufo.x + ufo.width / 2, ufo.y + ufo.height / 2, "#ff0000");
            score += ufo.points;
            ufo = null;
            playerBullets.splice(bi, 1);
            updateUI();
          }
        });

        // Enemy bullets vs player
        enemyBullets.forEach((bullet, bi) => {
          if (
            bullet.x < player.x + player.width &&
            bullet.x + bullet.width > player.x &&
            bullet.y < player.y + player.height &&
            bullet.y + bullet.height > player.y
          ) {
            createExplosion(player.x + player.width / 2, player.y + player.height / 2, player.color);
            enemyBullets.splice(bi, 1);
            lives--;
            updateUI();

            if (lives <= 0) {
              gameOver();
            }
          }
        });

        // Bullets vs shields
        shields.forEach((shield) => {
          shield.pixels.forEach((pixel) => {
            if (!pixel.alive) return;

            const px = shield.x + pixel.x;
            const py = shield.y + pixel.y;

            // Player bullets
            playerBullets.forEach((bullet, bi) => {
              if (
                bullet.x < px + pixel.width &&
                bullet.x + bullet.width > px &&
                bullet.y < py + pixel.height &&
                bullet.y + bullet.height > py
              ) {
                pixel.alive = false;
                playerBullets.splice(bi, 1);
              }
            });

            // Enemy bullets
            enemyBullets.forEach((bullet, bi) => {
              if (
                bullet.x < px + pixel.width &&
                bullet.x + bullet.width > px &&
                bullet.y < py + pixel.height &&
                bullet.y + bullet.height > py
              ) {
                pixel.alive = false;
                enemyBullets.splice(bi, 1);
              }
            });
          });
        });

        // Invaders vs shields
        shields.forEach((shield) => {
          invaders.forEach((inv) => {
            shield.pixels.forEach((pixel) => {
              if (!pixel.alive) return;

              const px = shield.x + pixel.x;
              const py = shield.y + pixel.y;

              if (inv.x < px + pixel.width && inv.x + inv.width > px && inv.y < py + pixel.height && inv.y + inv.height > py) {
                pixel.alive = false;
              }
            });
          });
        });

        // Check for level completion
        if (invaders.length === 0) {
          nextLevel();
        }
      }

      function nextLevel() {
        level++;
        playerBullets = [];
        enemyBullets = [];
        createInvaders();
        createShields();
        updateUI();
      }

      function shoot() {
        if (!canShoot || !gameRunning || gamePaused) return;

        playerBullets.push({
          x: player.x + player.width / 2 - 2,
          y: player.y - 10,
          width: 4,
          height: 10,
        });

        canShoot = false;
        setTimeout(() => (canShoot = true), 300);
      }

      function gameOver() {
        gameRunning = false;
        document.getElementById("finalScore").textContent = score;
        document.getElementById("gameOverOverlay").classList.remove("hidden");
      }

      // Game loop
      function gameLoop() {
        if (!gameRunning || gamePaused) {
          requestAnimationFrame(gameLoop);
          return;
        }

        // Clear canvas
        ctx.fillStyle = "#000010";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Update
        updatePlayer();
        updateBullets();
        updateInvaders();
        updateUFO();
        updateExplosions();
        checkCollisions();

        // Draw
        drawShields();
        drawPlayer();
        invaders.forEach((inv) => drawInvader(inv));
        playerBullets.forEach((b) => drawBullet(b, "#ffffff"));
        enemyBullets.forEach((b) => drawBullet(b, "#ff6600"));
        drawUFO();
        drawExplosions();

        requestAnimationFrame(gameLoop);
      }

      // Event listeners
      document.addEventListener("keydown", (e) => {
        keys[e.key] = true;

        if (e.key === " " || e.key === "Space") {
          e.preventDefault();
          shoot();
        }

        if (e.key === "p" || e.key === "P") {
          if (gameRunning) {
            gamePaused = !gamePaused;
            document.getElementById("pauseOverlay").classList.toggle("hidden", !gamePaused);
          }
        }
      });

      document.addEventListener("keyup", (e) => {
        keys[e.key] = false;
      });

      // Mobile controls
      document.getElementById("leftBtn").addEventListener("touchstart", (e) => {
        e.preventDefault();
        keys["ArrowLeft"] = true;
      });
      document.getElementById("leftBtn").addEventListener("touchend", (e) => {
        keys["ArrowLeft"] = false;
      });
      document.getElementById("rightBtn").addEventListener("touchstart", (e) => {
        e.preventDefault();
        keys["ArrowRight"] = true;
      });
      document.getElementById("rightBtn").addEventListener("touchend", (e) => {
        keys["ArrowRight"] = false;
      });
      document.getElementById("fireBtn").addEventListener("touchstart", (e) => {
        e.preventDefault();
        shoot();
      });

      // Start/Restart buttons
      document.getElementById("startBtn").addEventListener("click", () => {
        document.getElementById("startOverlay").classList.add("hidden");
        initGame();
        gameRunning = true;
      });

      document.getElementById("restartBtn").addEventListener("click", () => {
        document.getElementById("gameOverOverlay").classList.add("hidden");
        initGame();
        gameRunning = true;
      });

      document.getElementById("resumeBtn").addEventListener("click", () => {
        gamePaused = false;
        document.getElementById("pauseOverlay").classList.add("hidden");
      });

      // Start game loop
      gameLoop();
    </script>
  </body>
</html>
