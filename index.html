<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ウェブサイト一覧 | Shunta Toda / Websites</title>
    <meta name="description" content="イベント・講演・体験会のために作成したウェブサイトのまとめ" />
    <meta name="theme-color" content="#f7fbff" />
    <link rel="stylesheet" href="./assets/home.css" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three/three.module.min.js" } }
    </script>
  </head>
  <body>
    <canvas id="bg" class="bg" aria-hidden="true"></canvas>

    <div class="page">
      <header class="hero">
        <p class="hero__eyebrow reveal">Shunta Toda</p>
        <h1 class="hero__title reveal">
          <span class="hero__title-main">Websites</span>
          <span class="hero__title-sub">イベント・講演で作ったサイトのまとめ</span>
        </h1>
        <p class="hero__lead reveal">
          技能五輪のガイド、中高生向けのAI×ウェブ制作体験、セミナー資料など、
          イベントや講演のために制作したウェブサイトを一覧にしています。
        </p>
        <p class="hero__count reveal" aria-live="polite">
          <span id="count-shown">0</span> / <span id="count-total">0</span> sites
        </p>
      </header>

      <section class="toolbar reveal" aria-label="絞り込みと並び替え">
        <div class="toolbar__row">
          <div class="search">
            <svg class="search__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
            </svg>
            <input id="search" class="search__input" type="search" placeholder="キーワードで検索" aria-label="サイトを検索" autocomplete="off" />
          </div>
          <div class="sort" role="group" aria-label="並び替え">
            <button type="button" class="chip is-active" data-sort="desc" aria-pressed="true">新しい順</button>
            <button type="button" class="chip" data-sort="asc" aria-pressed="false">古い順</button>
          </div>
        </div>
        <div id="year-chips" class="chips" role="group" aria-label="年で絞り込み"></div>
      </section>

      <main>
        <ul id="grid" class="grid" aria-label="ウェブサイト一覧"></ul>
        <p id="empty" class="empty" hidden>該当するサイトがありません。</p>
      </main>

      <footer class="footer reveal">
        <a href="https://websites.shuntem.net/">websites.shuntem.net</a>
      </footer>
    </div>

    <script type="module" src="./assets/home.js"></script>
  </body>
</html>
